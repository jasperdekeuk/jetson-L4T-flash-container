name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ubuntu_version: ["22.04"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Build and push
        run: |
          TAG=${{ matrix.ubuntu_version }}
          docker build \
            --build-arg BASE_IMAGE=ubuntu:$TAG \
            -t $IMAGE_NAME:$TAG \
            -t $IMAGE_NAME:latest-$TAG \
            .
          docker push $IMAGE_NAME:$TAG
          docker push $IMAGE_NAME:latest-$TAG
